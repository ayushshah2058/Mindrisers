<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <style>
        /* Google Fonts */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #e0e7ff, #f3e8ff, #fce7f3);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

/* Main Container */
.main-container {
    width: 100%;
    max-width: 1100px;
    min-height: 650px;
    display: flex;
    background: #ffffff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
}

/* Signup Form Section */
.signup-form {
    flex: 1;
    padding: 45px 55px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* Heading */
.title {
    font-size: 32px;
    font-weight: 700;
    color: #1e1b4b;
    margin-bottom: 8px;
}

.text {
    font-size: 15px;
    color: #77778a;
    margin-bottom: 28px;
}

/* Labels */
label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #33334d;
    margin-bottom: 7px;
}

/* Input Fields */
input {
    width: 100%;
    height: 48px;
    padding: 0 15px;
    margin-bottom: 18px;
    border: 1px solid #dedeea;
    border-radius: 10px;
    background: #f9f9fc;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    color: #222;
    outline: none;
    transition: 0.3s ease;
}

input:focus {
    border-color: #7c3aed;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
}

/* Main Signup Button */
.signup-form form button {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color: #ffffff;
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 5px;
    transition: 0.3s ease;
}

.signup-form form button:hover {
    background: linear-gradient(135deg, #6d28d9, #4338ca);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
}

/* Login Text */
.signup-form p {
    font-size: 13px;
    color: #77778a;
    text-align: center;
    margin-top: 18px;
}

.login {
    color: #6d28d9;
    font-weight: 600;
    text-decoration: none;
}

.login:hover {
    text-decoration: underline;
}

/* OR Divider */
.signup-form hr {
    border: none;
    border-top: 1px solid #e5e5ef;
    margin-top: 15px;
}

/* Social Signup Buttons */
.signup-form > button {
    width: 100%;
    height: 46px;
    margin-top: 12px;
    border: 1px solid #dedeea;
    border-radius: 10px;
    background: #ffffff;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.3s ease;
}

.signup-form > button:hover {
    background: #f5f3ff;
    border-color: #a78bfa;
    transform: translateY(-2px);
}

/* Social Links */
.auth {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    color: #33334d;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
}

/* Terms and Privacy */
.signup-form > p:last-of-type {
    font-size: 12px;
    line-height: 1.8;
    margin-top: 5px;
}

.signup-form > p:last-of-type a {
    color: #6d28d9;
    text-decoration: none;
    font-weight: 500;
}

/* Advertisement Section */
.advertisement {
    flex: 1;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.advertisement img {
    width: 100%;
    max-width: 450px;
    height: auto;
    object-fit: contain;
    border-radius: 15px;
}

/* Responsive Design */
@media (max-width: 900px) {
    .main-container {
        max-width: 550px;
    }

    .advertisement {
        display: none;
    }

    .signup-form {
        padding: 40px;
    }
}

@media (max-width: 480px) {
    body {
        padding: 15px;
    }

    .main-container {
        border-radius: 18px;
    }

    .signup-form {
        padding: 30px 22px;
    }

    .title {
        font-size: 28px;
    }

    .text {
        font-size: 14px;
    }
}
    </style>
</head>
<body>
    <main>
        <div class="main-container">
            <div class="signup-form">
                <h3 class="title">Sign Up</h3>
                <p class="text">Let's get Started</p>
                <form action="submit" method="post">
                <label for="name">Name</label>
                <input type="text" class="name" id="name" name="name" >
                <label for="email">Email</label>
                <input type="email" class="email" id="email" name="email" > <br> 
                <label for="password">Password</label>
                <input type="password" class="password" id="password" name="password" >  <br>
                <label for="repassword">Re-enter Password</label>
                <input type="password" class="repassword" id="repassword" name="repassword" >  <br>
                <button type="submit">Sign Up</button>
                <p>Already have account? <a href="#login" class="login">Log In</a></p>
                <p>or</p><hr><br>
            </form>
            <button><a href="https://www.google.com/webhp?hl=en&sa=X&ved=2ahUKEwi574n_u5CXAxWmi2MGHdH-O94QPHoECAYQBA" class="auth">Sign Up with Google</a></button>
            <button><a href="https://www.google.com/webhp?hl=en&sa=X&ved=2ahUKEwi574n_u5CXAxWmi2MGHdH-O94QPHoECAYQBA" class="auth">Sign Up with Facebook</a></button>
            <button><a href="https://www.google.com/webhp?hl=en&sa=X&ved=2ahUKEwi574n_u5CXAxWmi2MGHdH-O94QPHoECAYQBA" class="auth">Sign Up with GitHub</a></button>
            <p>By signing up to create an account i accept </p>
            <p>Company's <a href="#terms">Terms of use and Privacy Policy</a></p>
            </div>
            <div class="advertisement">
                <img src="https://img.magnific.com/free-vector/access-control-system-abstract-concept_335657-3180.jpg?semt=ais_hybrid&w=740&q=80" alt="">
            </div>
        </div>
    </main>
</body>
</html>
