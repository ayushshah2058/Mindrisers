<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
</head>
<body>
    <main>
        <div class="main-container">
            <div class="signup-form">
                <h3 class="title">Sign Up</h3>
                <p class="text">Let's get Started</p>
                <form action="submit" method="post">
                <label for="name">Name</label><br>
                <input type="text" class="name" id="name" name="name" ><br>
                <label for="email">Email</label><br>
                <input type="email" class="email" id="email" name="email" > <br> 
                <label for="password">Password</label><br>
                <input type="password" class="password" id="password" name="password" >  <br>
                <label for="repassword">Re-enter Password</label><br>
                <input type="repassword" class="repassword" id="repassword" name="repassword" >  <br>
                <button type="submit">Sign Up</button>
                <p>Already have account? <a href="#login" class="login">Log In</a></p>
                <p>or</p><hr>
            </form>
            <button><a href="https://www.google.com/webhp?hl=en&sa=X&ved=2ahUKEwi574n_u5CXAxWmi2MGHdH-O94QPHoECAYQBA" class="auth">Sign Up with Google</a></button>
            <button><a href="https://www.google.com/webhp?hl=en&sa=X&ved=2ahUKEwi574n_u5CXAxWmi2MGHdH-O94QPHoECAYQBA" class="auth">Sign Up with Facebook</a></button>
            <button><a href="https://www.google.com/webhp?hl=en&sa=X&ved=2ahUKEwi574n_u5CXAxWmi2MGHdH-O94QPHoECAYQBA" class="auth">Sign Up with GitHub</a></button>
            <p>By signing up to create an account i accept </p><br>
            <p>Company's <a href="#terms">Terms of use and Privacy Policy</a></p>
            </div>
            <div class="advertisement">
                <img src="https://img.magnific.com/free-vector/access-control-system-abstract-concept_335657-3180.jpg?semt=ais_hybrid&w=740&q=80" alt="">
            </div>
        </div>
    </main>
</body>
</html>
