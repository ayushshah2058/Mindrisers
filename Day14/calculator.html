<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto 0;
        }
        .parent{
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin: 1rem;
        }
        .calculator{
            width: 300px;
            height: 500px;
            background-color: whitesmoke;
            padding: 1rem;
            border-radius: 24px;
            box-shadow: inset 4px 4px 3px 0px rgba(76, 76, 76, 0.379),
                        inset -4px -4px 3px 0px rgba(128, 42, 42, 0.379);
        }
        h5{
            font-size: 0.8rem;
            margin-top: 1rem;
        }
        .display{
            height: 70px;
            margin-top: 1rem;
            border-radius: 24px;
            padding: 1rem;
            text-align: right;
            box-shadow: inset 4px 4px 3px 0px rgba(76, 76, 76, 0.379),
                        inset -4px -4px 3px 0px rgba(175, 174, 174, 0.379);

            p{
                font-size: 2rem;
                font-weight: 800;
            }
        }
        .buttons{
            height: 300px;
            display: flex;
            justify-content: space-between;
            align-items: space-between;
            margin-top: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .button{
            width: 54px;
            height: 50px;
            border-radius: 12px;
            padding: 0.8rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 900;
            /* blur */
            box-shadow: 2px 2px 4px 2px rgba(95, 95, 95, 0.379),
                        -2px -2px 4px 2px rgba(103, 103, 103, 0.379);
        }
        .calculations{
            color: rgb(4, 155, 249);
        }
        [id='0']{
            flex-grow: 1;
        }
        [id='=']{
            background-color:  rgb(4, 155, 249);
            color: white;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="calculator">
            <header>
                <h5>NORMAL MODE</h5>

            </header>

            <div class="display">
                <p>100</p>
            </div>
            <div class="buttons">
                <div class="button calculations" id="AC">AC</div>
                <div class="button calculations" id="+/-">+/-</div>
                <div class="button calculations" id="%">%</div>
                <div class="button calculations" id="/">/</div>
                <div class="button nums" id="7">7</div>
                <div class="button nums" id="8">8</div>
                <div class="button nums" id="9">9</div>
                <div class="button calculations" id="X">X</div>
                <div class="button nums" id="4">4</div>
                <div class="button nums" id="5">5</div>
                <div class="button nums" id="6">6</div>
                <div class="button calculations" id="-">-</div>
                <div class="button nums" id="1">1</div>
                <div class="button nums" id="2">2</div>
                <div class="button nums" id="3">3</div>
                <div class="button calculations" id="+">+</div>
                <div class="button nums 0" id="0">0</div>
                <div class="button nums" id=".">.</div>
                <div class="button calculations" id="=">=</div>
            </div>
        </div>
    </div>
</body>
</html>
