<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress bar</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .parent{
            display: flex;
            flex-direction: column;
            gap: 5rem;
            justify-content: center;
            align-items: center;
            margin: 2rem;
        }
        .container{
            width:80%;
            height: 36px;
            border: 2px solid;
            border-radius: 24px;
            display: flex;
        }
        .first{
            background: linear-gradient(90deg, #0f0c29 0%, #857fc6 50%, #24243e 100%);
            height: 100%;
            border-radius: 24px;
            animation-name: first;
            animation-duration: 1s;
            animation-delay: 0.5s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: 1;
            animation-fill-mode:forwards;
            /* animation: redbar 0.4s ease-in-out 0s 1 normal forwards;; */
        }
        @keyframes first{
            0%{
                width: 0%;
            }
            100%{
                width: 70%
            }
        }
        .second{
            height: 100%;
            border-radius: 24px;
            background: linear-gradient(90deg, #03001e 0%, #7303c0 33%, #ec38bc 66%, #fdeff9 100%);
            animation: second 3s ease-in 0s infinite normal forwards;      
        }
        @keyframes second{
            0%{
                width: 0%;
            }
            50%{
                width: 100%;
            }
            100%{
                width:0%;
            }
        }

        .third{
            background: linear-gradient(90deg, #40e0d0 0%, #ff8c00 50%, #ff0080 100%);
            height: 100%;
            border-radius: 24px;
            animation: third 5s ease-in-out 0s infinite reverse forwards;
        }
        @keyframes third{
            0%{
                width: 0%;
                opacity: 0.1;
            }
            75%{
                width: 100%;
                opacity: 1;
            }
            100%{
                width: 0%;
                opacity: 0;
            }
        }
        .fourth{
            background: linear-gradient(90deg, #000000 0%, #0f9b0f 100%);
            height: 100%;
            border-radius: 24px;
            animation: fourth 2s ease-out 0s infinite;
        }
        @keyframes fourth{
            0%{ width: 100%;}
            70%{
                width: 70%;
            }
            100%{
                width: 0%;
                animation-timing-function: cubic-bezier(0.47, 0, 0.745, 0.715) ;
            }
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="container">
            <div class="progress-bar first"></div>
        </div>

        <div class="container">
            <div class="progress-bar second"></div>
        </div>

        <div class="container">
            <div class="progress-bar third"></div>
        </div>

        <div class="container">
            <div class="progress-bar fourth"></div>
        </div>
    </div>
</body>
</html>
