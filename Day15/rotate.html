<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img{
            height: 500px;
            width:500px;
            animation: rotate 10s ease-in 0s infinite normal forwards;
        }
        
        @keyframes rotate{
            0%{
                transform:rotate(0deg);

            }
            100%{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="parent">
        <img src="https://preview.themewagon.com/restoran/img/hero.png" alt="">

        </div>
    </div>
</body>
</html>
