<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader</title>
    <style>
        .parent{
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }
        .loader-container{
            border: 2px solid black;
            padding: 1rem 2rem;
            margin: 1rem;
        }
        .loader1{
            height: 50px;
            width: 50px;
            border-radius: 50%;
            border: 12px solid skyblue;
            border-top: 12px solid orangered;
            animation: loader1 0.5s linear 0s infinite ;
        }
        .loader2{
            justify-self: center;
            align-content: center;
            height: 50px;
            width: 50px;
            border-radius: 50%;
            border: 12px solid transparent;
            border-top: 12px solid purple;
            border-right: 12px solid purple;
            animation: loader1 1.2s ease-in-out 0s infinite;
        }
        
        @keyframes loader1{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
            
        }
        .loader3{
            justify-self: center;
            align-content: center;
            height: 50px;
            width: 50px;
            border-radius: 50%;
            border: 2px solid purple;
            border-top: 12px solid purple;
            animation: loader1 0.5s linear 0s infinite;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="loader-container">
            <div class="loader1"></div>
            <p>Loader #2</p>
        </div>
        <div class="loader-container">
            <div class="loader2"></div>
            <p>Loader #20</p>
        </div>
        <div class="loader-container">
            <div class="loader3"></div>
            <p>Loader #25</p>
        </div>

    </div>
</body>
</html>
