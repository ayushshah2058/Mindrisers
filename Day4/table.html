<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table,th,td{
            border: 2px solid;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table border>
        <thead>
            <tr>
                <th>Header</th>
                <th>Header</th>
                <th>Header</th>
                <th>Header</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="4">Span row</td>
                <td colspan="3">Span columns</td>
            </tr>
            <tr>
                <td colspan="2">span columns</td>
                <td rowspan="3">span both</td>
            </tr>
            <tr>
                <td rowspan="2">span rows</td>
                <td>span col</td>
            </tr>
            <tr>
                <td>span both</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
